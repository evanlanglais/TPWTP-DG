services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tpwtp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tpwtp-local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  collector:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:tpwtp-local@postgres:5432/tpwtp?sslmode=disable
      POLL_INTERVAL: 5m
      API_CONCURRENCY: "15"
      LOG_LEVEL: info
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
