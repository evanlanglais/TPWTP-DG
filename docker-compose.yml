services:
  collector:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      POLL_INTERVAL: ${POLL_INTERVAL:-5m}
      API_CONCURRENCY: ${API_CONCURRENCY:-15}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped

networks:
  default:
    enable_ipv6: true