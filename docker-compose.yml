services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tpwtp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  collector:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tpwtp}?sslmode=disable
      POLL_INTERVAL: ${POLL_INTERVAL:-5m}
      API_CONCURRENCY: ${API_CONCURRENCY:-15}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
